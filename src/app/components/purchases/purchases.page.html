<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Закупки</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openFilters()">
        <ion-icon name="filter-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="openPurchaseModal()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="refreshData($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-searchbar
    [(ngModel)]="searchTerm"
    (ionInput)="filterPurchases()"
    placeholder="Поиск по дилеру или товару"
    animated="true">
  </ion-searchbar>

<!--  <ion-fab vertical="bottom" horizontal="end" slot="fixed">-->
<!--    <ion-fab-button (click)="openPurchaseModal()">-->
<!--      <ion-icon name="add"></ion-icon>-->
<!--    </ion-fab-button>-->
<!--  </ion-fab>-->

  <ion-list>
    <ion-item-sliding *ngFor="let purchase of filteredPurchases">
      <ion-item class="purchase-item">
        <ion-label>
          <h2><strong>{{ purchase.dealer_name }}</strong></h2>
          <p>
            Закупок: {{ getPurchaseItemsCount(purchase) }} шт.
          </p>
          <p>
            Возвратов: {{ getReturnItemsCount(purchase) }} шт.
          </p>
          <p *ngIf="purchase.notes" class="notes">{{ purchase.notes }}</p>
          <p class="date">{{ purchase.created_at | date:'dd.MM.yyyy HH:mm' }}</p>
          <div class="total-amount">
            <strong>{{ purchase.total_amount | number:'1.2-2' }} сом.</strong>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option (click)="viewPurchaseDetails(purchase)" color="primary">
          <ion-icon name="eye" slot="icon-only"></ion-icon>
        </ion-item-option>
        <ion-item-option (click)="openPurchaseModal(purchase)" color="warning">
          <ion-icon name="create" slot="icon-only"></ion-icon>
        </ion-item-option>
<!--        <ion-item-option (click)="deletePurchase(purchase)" color="danger">-->
<!--          <ion-icon name="trash" slot="icon-only"></ion-icon>-->
<!--        </ion-item-option>-->
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="filteredPurchases.length === 0">
      <ion-label>
        <p>Нет закупок</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
