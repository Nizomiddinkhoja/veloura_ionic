<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Заметки</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openNoteDialog()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Заметки</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="refreshNotes($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="container">
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterNotes()"
      placeholder="Поиск заметок">
    </ion-searchbar>

    <ion-list>
      <ion-item-sliding *ngFor="let note of filteredNotes">
        <ion-item>
          <ion-label>
            <h2>{{ note.text }}</h2>
            <p *ngIf="note.created_at">Создан: {{ note.created_at | date:'dd.MM.yyyy' }}</p>
          </ion-label>
        </ion-item>

        @if (isAdmin) {
          <ion-item-options side="end">
            <ion-item-option (click)="openNoteDialog(note)" color="primary">
              <ion-icon name="create" slot="icon-only"></ion-icon>
            </ion-item-option>
            <ion-item-option (click)="deleteNote(note)" color="danger">
              <ion-icon name="trash" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        }
      </ion-item-sliding>
    </ion-list>
  </div>
</ion-content>
