<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Продукты</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openFilters()">
        <ion-icon name="filter-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Продукты</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="refreshProducts($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="container">
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterProducts()"
      placeholder="Поиск продуктов">
    </ion-searchbar>

    <ion-list>
      <ion-item-sliding *ngFor="let product of filteredProducts">
        <ion-item>
          <ion-label>
            <h2>{{ product.name }}</h2>
            <p>Цена покупки: {{ product.buy_price | number:'1.2-2' }} сом.</p>
            <p>Цена продажи: {{ product.sell_price | number:'1.2-2' }} сом.</p>
            <p>Остаток: {{ product.quantity }} шт.</p>
            <p *ngIf="product.created_at">Создан: {{ product.created_at | date:'dd.MM.yyyy' }}</p>
          </ion-label>
          <ion-badge
            slot="end"
            [color]="product.quantity > 10 ? 'success' : product.quantity > 0 ? 'warning' : 'danger'">
            {{ product.quantity }}
          </ion-badge>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option (click)="openProductModal(product)" color="primary">
            <ion-icon name="create" slot="icon-only"></ion-icon>
          </ion-item-option>
          <ion-item-option (click)="deleteProduct(product)" color="danger">
            <ion-icon name="trash" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>
  </div>
</ion-content>
